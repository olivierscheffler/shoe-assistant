# Déploiement du front sur GitHub Pages.
#
# Le site est entièrement statique : questionnaire, classement et export Markdown
# tournent dans le navigateur. Aucun secret, aucune variable de backend à fournir.
#
# Settings → Pages → Source = « GitHub Actions ».
#
# Si le dépôt s'appelle <utilisateur>.github.io (site racine), remplacez BASE_PATH par "/".

name: Déployer le site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  BASE_PATH: /${{ github.event.repository.name }}/

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Installer les dépendances
        run: bun install

      - name: Typecheck
        run: bunx tsc -b --noEmit

      - name: Build
        run: |
          bunx vite build --base="$BASE_PATH"
          # GitHub Pages ne connaît pas le routage d'une application monopage :
          # 404.html sert la même application, qui rétablit ensuite la bonne route.
          cp dist/index.html dist/404.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    steps:
      - id: pages
        uses: actions/deploy-pages@v4
